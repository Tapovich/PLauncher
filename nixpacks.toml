# Nixpacks configuration for Railway deployment

[phases.setup]
nixPkgs = ["python311", "postgresql"]

[phases.install]
cmds = [
  "cd apps/api && pip install --upgrade pip",
  "cd apps/api && pip install -r requirements.txt"
]

[start]
cmd = "cd apps/api && python -m uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"

[variables]
PYTHONUNBUFFERED = "1"
