# Nixpacks configuration for LaunchKit API

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "export PATH=\"$PATH:$(python311 -c 'import sys; print(sys.executable.replace(\"python311\", \"\"))')\"",
  "ln -sf $(which python311) /usr/local/bin/python3",
  "python3 --version",
  "python3 -c 'import sys; print(f\"Python executable: {sys.executable}\")'",
  "python3 -m pip install --upgrade pip setuptools wheel",
  "python3 -m pip install -r requirements.txt"
]

[start]
cmd = "python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"