# Nixpacks configuration for LaunchKit API

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = [
  "export PATH=\"$PATH:/nix/var/nix/profiles/default/bin\"",
  "which python3 || ln -s $(which python311) /usr/local/bin/python3",
  "python3 --version",
  "python3 -m ensurepip --upgrade",
  "python3 -m pip install --upgrade pip",
  "python3 -m pip install -r requirements.txt"
]

[start]
cmd = "python3 -m uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHONUNBUFFERED = "1"
PATH = "$PATH:/nix/var/nix/profiles/default/bin"